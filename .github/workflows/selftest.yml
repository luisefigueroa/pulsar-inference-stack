name: Public stack checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fast pull-request checks
        if: github.event_name == 'pull_request'
        run: scripts/selftest.sh --checks-only
      - name: Full regression suite (manual)
        if: github.event_name == 'workflow_dispatch'
        run: scripts/selftest.sh
      - name: Check pull-request diff
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"
      - name: Require current specs for changed catalog entries
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check-new-specs.py --base "$BASE_SHA" --head "$HEAD_SHA" --merge-base
      - name: Check pull-request commit metadata privacy
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_commit_privacy.py --range "$BASE_SHA..$HEAD_SHA"
